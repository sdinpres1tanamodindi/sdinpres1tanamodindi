<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CMS Admin Panel</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; line-height: 1.5; }
    .section-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
    .form-group { margin-bottom: 12px; }
    label { display: inline-block; width: 160px; font-weight: bold; }
    input[type="text"], input[type="number"] { padding: 5px; width: 250px; }
    .btn-save { background: #2563eb; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; }
    .btn-save:disabled { background: #9ca3af; }
    .auth-box { background: #f3f4f6; padding: 15px; border-radius: 6px; margin-bottom: 25px; }
  </style>
</head>
<body>

  <h2>Pengaturan Website CMS Admin</h2>

  <!-- Autentikasi GitHub Token -->
  <div class="auth-box">
    <h3>Kredensial GitHub</h3>
    <div class="form-group">
      <label>Username GitHub:</label>
      <input type="text" id="gh-owner" placeholder="Contoh: username-anda">
    </div>
    <div class="form-group">
      <label>Nama Repositori:</label>
      <input type="text" id="gh-repo" placeholder="Contoh: website-kaili">
    </div>
    <div class="form-group">
      <label>GitHub Personal Token:</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
    </div>
    <button onclick="loadSettings()">Muat Data dari GitHub</button>
  </div>

  <form id="cms-form" style="display:none;" onsubmit="saveSettings(event)">
    <div id="form-container"></div>
    <button type="submit" class="btn-save" id="save-btn">Simpan Semua Perubahan</button>
  </form>

  <datalist id="font-list">
    <option value="Inter">
    <option value="Roboto">
    <option value="Poppins">
    <option value="Open Sans">
    <option value="Arial">
    <option value="Georgia">
    <option value="Times New Roman">
  </datalist>

  <script>
    const sections = [
      { key: 'header_nav', title: 'Header & Navigasi' },
      { key: 'hero_stats', title: 'Hero & Statistik' },
      { key: 'mulok_kaili', title: 'Seksi Mulok Kaili' },
      { key: 'profil_sambutan', title: 'Profil & Sambutan' },
      { key: 'konten_publik', title: 'Seksi Konten Publik' }
    ];

    let currentSha = '';

    async function loadSettings() {
      const owner = document.getElementById('gh-owner').value;
      const repo = document.getElementById('gh-repo').value;
      const token = document.getElementById('gh-token').value;

      if (!owner || !repo || !token) {
        alert('Mohon isi semua data kredensial GitHub!');
        return;
      }

      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/settings.json`, {
          headers: { 'Authorization': `token ${token}` }
        });
        
        if (!response.ok) throw new Error('Gagal mengambil data settings.json');

        const data = await response.json();
        currentSha = data.sha;
        const settings = JSON.parse(atob(data.content));

        renderForm(settings);
        document.getElementById('cms-form').style.display = 'block';
      } catch (err) {
        alert('Terjadi kesalahan: ' + err.message);
      }
    }

    function renderForm(settings) {
      const container = document.getElementById('form-container');
      container.innerHTML = '';

      sections.forEach(sec => {
        const item = settings[sec.key] || {};
        const html = `
          <div class="section-card">
            <h3>${sec.title}</h3>
            <div class="form-group">
              <label>Nama Menu:</label>
              <input type="text" id="${sec.key}_menu_name" value="${item.menu_name || ''}">
            </div>
            <div class="form-group">
              <label>Status Tampil:</label>
              <input type="checkbox" id="${sec.key}_is_visible" ${item.is_visible ? 'checked' : ''}> Tampilkan Seksi Ini
            </div>
            <div class="form-group">
              <label>Jenis Font:</label>
              <input list="font-list" id="${sec.key}_font_family" value="${item.font_family || ''}" placeholder="Pilih atau ketik font...">
            </div>
            <div class="form-group">
              <label>Warna Font:</label>
              <input type="color" id="${sec.key}_font_color" value="${item.font_color || '#000000'}">
            </div>
            <div class="form-group">
              <label>Ukuran Font (px):</label>
              <input type="number" id="${sec.key}_font_size" value="${item.font_size || 16}"> px
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }

    async function saveSettings(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'Menyimpan...';

      const owner = document.getElementById('gh-owner').value;
      const repo = document.getElementById('gh-repo').value;
      const token = document.getElementById('gh-token').value;

      const updatedSettings = {};
      sections.forEach(sec => {
        updatedSettings[sec.key] = {
          menu_name: document.getElementById(`${sec.key}_menu_name`).value,
          is_visible: document.getElementById(`${sec.key}_is_visible`).checked,
          font_family: document.getElementById(`${sec.key}_font_family`).value,
          font_color: document.getElementById(`${sec.key}_font_color`).value,
          font_size: parseInt(document.getElementById(`${sec.key}_font_size`).value, 10)
        };
      });

      const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(updatedSettings, null, 2))));

      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/settings.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update website settings via CMS Admin',
            content: updatedContentBase64,
            sha: currentSha
          })
        });

        if (!response.ok) throw new Error('Gagal memperbarui file di GitHub');

        const resData = await response.json();
        currentSha = resData.content.sha;
        alert('Pengaturan berhasil disimpan!');
      } catch (err) {
        alert('Gagal menyimpan: ' + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'Simpan Semua Perubahan';
      }
    }
  </script>
</body>
</html>
